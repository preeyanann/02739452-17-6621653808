<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ราคาน้ำมันวันนี้{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #faf6f1; --bg-2: #f5ede4; --card: #ffffff; --card-2: #f7f9fc; --ink: #101828; --muted: #5b6678;
      --line: #ece4dc; --accent: #dc2626; --accent-2: #f59e0b; --accent-soft: rgba(220, 38, 38, .10);
      --hero-1: #991b1b; --hero-2: #dc2626; --hero-ink: #fffbeb;
      --ok: #067647; --ok-soft: #dcfae6; --warn: #b54708; --warn-soft: #fef0e1; --bad: #c0362c; --bad-soft: #fde8e6;
      --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 16px rgba(16, 24, 40, .06);
      --up: #d92d20; --down: #079455;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #110b09; --bg-2: #1a110d; --card: #1c1411; --card-2: #251a15; --ink: #e8eef4; --muted: #93a2b1;
        --line: #3a2a22; --accent: #f87171; --accent-2: #fbbf24; --accent-soft: rgba(248, 113, 113, .14);
        --hero-1: #450a0a; --hero-2: #7f1d1d; --hero-ink: #fffbeb;
        --ok: #47cd89; --ok-soft: #12321f; --warn: #f5a35c; --warn-soft: #3a2614; --bad: #f97066; --bad-soft: #3d1a17;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
        --up: #f97066; --down: #47cd89;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "IBM Plex Sans Thai", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
    .num, .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

    header.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--card) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .bar { display: flex; align-items: center; gap: 28px; height: 62px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; color: var(--ink); text-decoration: none; }
    .logo-mark { width: 38px; height: 38px; border-radius: 10px; display: block; }
    .logo { gap: 12px; font-size: 18px; line-height: 1.15; }
    .logo-div { width: 2px; height: 34px; background: var(--accent); }
    .logo small { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 400; color: var(--muted); line-height: 1.3; }
    .logo-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); }
    nav { display: flex; gap: 4px; }
    nav a { color: var(--muted); text-decoration: none; font-weight: 500; padding: 7px 14px; border-radius: 999px; }
    nav a:hover { background: var(--card-2); color: var(--ink); }
    nav a.on { background: var(--accent-soft); color: var(--accent); }
    .bar .spacer { flex: 1; }
    .live { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
    @media (max-width: 640px) { .live { display: none; } .bar { gap: 12px; } .logo small, .logo-div { display: none; } }

    main { padding: 22px 0 56px; }
    .hero { position: relative; overflow: hidden; border-radius: 18px; padding: 26px 28px; margin-bottom: 18px; color: var(--hero-ink);
            background: radial-gradient(900px 320px at 100% 0%, rgba(251, 191, 36, .55), transparent 60%), linear-gradient(135deg, var(--hero-1), var(--hero-2)); }
    .hero h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.01em; }
    .hero p { margin: 0; opacity: .85; }
    .hero .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .hero .pill { background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .18); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
    .hero svg.bg { position: absolute; right: -10px; bottom: -20px; width: 220px; opacity: .12; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
    .grid { display: grid; gap: 14px; }
    h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
    h2 .sub { font-weight: 400; color: var(--muted); font-size: 13px; }
    .section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 2px 10px; }
    .section-title h2 { margin: 0; }

    .kpis { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-bottom: 14px; }
    .kpi { position: relative; overflow: hidden; }
    .kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--k, var(--accent)); }
    .kpi .label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .kpi .value { font-size: 28px; font-weight: 700; margin-top: 2px; }
    .kpi .value small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 4px; font-family: "IBM Plex Sans Thai", sans-serif; }
    .kpi .hint { color: var(--muted); font-size: 12.5px; }

    .board { grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); }
    .fuel { cursor: pointer; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); transition: transform .12s, border-color .12s; text-align: left; font: inherit; color: inherit; }
    .fuel:hover { transform: translateY(-2px); border-color: var(--accent); }
    .fuel.on { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-soft), var(--card)); }
    .fuel .name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .fuel .swatch { width: 10px; height: 10px; border-radius: 3px; }
    .fuel .price { font-size: 26px; font-weight: 700; margin: 4px 0 0; }
    .fuel .price small { font-size: 12px; color: var(--muted); font-weight: 500; font-family: "IBM Plex Sans Thai", sans-serif; }
    .fuel .meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
    .up { color: var(--up); } .down { color: var(--down); }

    .filters { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; margin-bottom: 14px; }
    .filters label { display: flex; flex-direction: column; font-size: 12.5px; color: var(--muted); gap: 5px; font-weight: 500; }
    select, input, button { font: inherit; color: var(--ink); background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    select:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { cursor: pointer; }
    button.ghost:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; user-select: none; background: var(--card-2); }
    .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .chip.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); font-weight: 600; }

    .two { grid-template-columns: 1.7fr 1fr; margin-bottom: 14px; }
    @media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
    .chart { position: relative; height: 320px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; font-size: 12.5px; text-transform: uppercase; letter-spacing: .03em; background: var(--card-2); }
    th:first-child { border-top-left-radius: 10px; } th:last-child { border-top-right-radius: 10px; }
    tbody tr:hover td { background: var(--card-2); }
    td.num, th.num { text-align: right; }
    td.price { font-weight: 700; }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
    .brand i { width: 9px; height: 9px; border-radius: 3px; }
    .scroll { overflow-x: auto; }
    .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 12px; color: var(--muted); font-size: 13px; }

    .src { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 600; margin-right: 4px; }
    .src.ptt_soap { background: rgba(37, 99, 235, .14); color: #3b82f6; }
    .src.bangchak_api { background: rgba(16, 185, 129, .14); color: #10b981; }
    .src.eppo_web { background: rgba(245, 158, 11, .16); color: #d97706; }
    .tag { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
    .tag.success, .tag.ok { background: var(--ok-soft); color: var(--ok); }
    .tag.partial, .tag.warn { background: var(--warn-soft); color: var(--warn); }
    .tag.failed, .tag.bad { background: var(--bad-soft); color: var(--bad); }
    .tag.running { background: var(--accent-soft); color: var(--accent); }
    .muted { color: var(--muted); }
    .error { background: var(--bad-soft); color: var(--bad); padding: 12px 16px; border-radius: 12px; display: none; margin-bottom: 14px; }
    footer { color: var(--muted); font-size: 12.5px; text-align: center; padding: 8px 0 28px; }
  </style>
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="logo" href="/">
    <img class="logo-mark" src="/static/logo.svg" alt="" width="38" height="38">
    <span class="logo-div" aria-hidden="true"></span>
    <span>ราคาน้ำมันกรุงเทพฯ<small><span class="logo-dot" aria-hidden="true"></span>Fuel Price Pipeline · 02739452</small></span>
  </a>
  <nav>
    <a href="/" class="{{ 'on' if page == 'dashboard' }}">Dashboard</a>
    <a href="/status" class="{{ 'on' if page == 'status' }}">สถานะ Pipeline</a>
  </nav>
  <span class="spacer"></span>
  <span class="live"><span class="dot"></span>อ่านจาก PostgreSQL โดยตรง</span>
</div></header>
<main class="wrap">
  <div id="error" class="error"></div>
  {% block content %}{% endblock %}
</main>
<footer>ข้อมูลจาก ปตท. · บางจาก · สำนักงานนโยบายและแผนพลังงาน (สนพ.) · ไม่มีข้อมูลส่วนบุคคล</footer>
<script>
  async function getJSON(url) {
    const res = await fetch(url);
    const body = await res.json();
    if (!res.ok) { const e = document.getElementById('error'); e.textContent = body.error || 'error'; e.style.display = 'block'; throw new Error(body.detail); }
    return body;
  }
  const fmt = (n, d = 2) => n == null ? '–' : Number(n).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const thaiDate = v => v ? new Date(v).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) : '–';
</script>
{% block scripts %}{% endblock %}
</body>
</html>

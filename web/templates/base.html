<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ราคาน้ำมันวันนี้{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f8; --card: #ffffff; --ink: #17202a; --muted: #5d6b78; --line: #dde3e9;
      --accent: #0b6e4f; --accent-soft: #e3f2ec; --warn: #b54708; --warn-soft: #fef0e1;
      --bad: #b42318; --bad-soft: #fde8e6; --ok: #067647; --ok-soft: #dcfae6;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1418; --card: #182027; --ink: #e8edf1; --muted: #9aa8b4; --line: #2a3640;
        --accent: #4cc38a; --accent-soft: #163327; --warn: #f5a35c; --warn-soft: #3a2614;
        --bad: #f97066; --bad-soft: #3d1a17; --ok: #47cd89; --ok-soft: #12321f;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "IBM Plex Sans Thai", system-ui, sans-serif; }
    header { background: var(--card); border-bottom: 1px solid var(--line); }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
    .bar { display: flex; align-items: center; gap: 24px; height: 60px; }
    .brand { font-weight: 700; font-size: 17px; }
    .brand span { color: var(--accent); }
    nav a { color: var(--muted); text-decoration: none; margin-right: 16px; font-weight: 500; }
    nav a.on { color: var(--ink); border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
    main { padding: 24px 0 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    .grid { display: grid; gap: 14px; }
    .kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 14px; }
    .kpi .label { color: var(--muted); font-size: 13px; }
    .kpi .value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .kpi .hint { color: var(--muted); font-size: 12px; }
    .two { grid-template-columns: 2fr 1fr; margin-bottom: 14px; }
    @media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 14px; }
    .filters label { display: flex; flex-direction: column; font-size: 13px; color: var(--muted); gap: 4px; }
    select, input, button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
    button { cursor: pointer; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; user-select: none; }
    .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    h2 { font-size: 16px; margin: 0 0 10px; }
    .chart { position: relative; height: 300px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: 13px; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .scroll { overflow-x: auto; }
    .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; color: var(--muted); font-size: 13px; }
    .tag { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
    .tag.success, .tag.ok { background: var(--ok-soft); color: var(--ok); }
    .tag.partial, .tag.warn { background: var(--warn-soft); color: var(--warn); }
    .tag.failed, .tag.bad { background: var(--bad-soft); color: var(--bad); }
    .tag.running { background: var(--accent-soft); color: var(--accent); }
    .muted { color: var(--muted); }
    .error { background: var(--bad-soft); color: var(--bad); padding: 12px; border-radius: 8px; display: none; margin-bottom: 14px; }
  </style>
</head>
<body>
<header><div class="wrap bar">
  <div class="brand">⛽ ราคาน้ำมัน<span>กทม.</span></div>
  <nav>
    <a href="/" class="{{ 'on' if page == 'dashboard' }}">Dashboard</a>
    <a href="/status" class="{{ 'on' if page == 'status' }}">สถานะ Pipeline</a>
  </nav>
</div></header>
<main class="wrap">
  <div id="error" class="error"></div>
  {% block content %}{% endblock %}
</main>
<script>
  async function getJSON(url) {
    const res = await fetch(url);
    const body = await res.json();
    if (!res.ok) { const e = document.getElementById('error'); e.textContent = body.error || 'error'; e.style.display = 'block'; throw new Error(body.detail); }
    return body;
  }
  const fmt = (n, d = 2) => n == null ? '–' : Number(n).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
